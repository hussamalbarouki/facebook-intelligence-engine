name: Test and publish GHCR image
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: publish-browser-v13-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install fastapi==0.119.1 httpx cryptography requests
      - run: python -m unittest discover -s tests -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Facebook extraction API, self-hosted
      - name: Smoke test live API health from Docker
        timeout-minutes: 3
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          docker run -d --rm --name fb-engine-api-smoke \
            --memory=2g --cpus=2 \
            -e API_KEY=abcdefghijklmnopqrstuvwxyzABCDEF \
            -p 127.0.0.1:18765:8000 "$IMAGE"
          trap 'docker stop fb-engine-api-smoke >/dev/null 2>&1 || true' EXIT
          EXPECTED_VERSION=$(sed -n "s/^VERSION='\\([^']*\\)'/\\1/p" app/main.py)
          test -n "$EXPECTED_VERSION"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:18765/healthz \
              | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("ok") is True and d.get("service")=="facebook-intelligence-engine" and d.get("version")==sys.argv[1]' "$EXPECTED_VERSION" 2>/dev/null; then
              echo "Real-container API startup and public health route OK"
              exit 0
            fi
            sleep 2
          done
          echo "::error::API did not start or healthz was unhealthy."
          docker logs --tail 80 fb-engine-api-smoke || true
          exit 1
      - name: Trigger Coolify after a successful image publish (optional)
        if: ${{ success() }}
        env:
          COOLIFY_DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -n "$COOLIFY_DEPLOY_WEBHOOK" ] && [ -n "$COOLIFY_TOKEN" ]; then
            curl --fail-with-body --retry 2 --retry-delay 5 \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_DEPLOY_WEBHOOK"
          else
            echo "Coolify webhook not configured; deployment must be triggered manually."
          fi
