services:
  facebook-engine:
    image: ghcr.io/hussamalbarouki/facebook-intelligence-engine:latest
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?set-a-strong-random-key}
      FACEBOOK_COOKIES_JSON: ${FACEBOOK_COOKIES_JSON:-}
      DATA_DIR: /data
    volumes:
      - facebook-engine-data:/data
    expose:
      - '8000'
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/healthz",timeout=3)']
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  facebook-engine-data: